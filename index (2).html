<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's in the Pantry</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pantry">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2e8b4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #24291f;
    --ink-soft: #4a5240;
    --paper: #f5f1e6;
    --paper-dim: #ece5d3;
    --line: #d9d0b8;
    --herb: #2e8b4f;
    --herb-dark: #1f6438;
    --mustard: #e3a412;
    --tomato: #e0532c;
    --sky: #1e88c7;
    --plum: #9450c4;
    --berry: #d63d72;
    --card: #fffdf7;
    --shadow: rgba(36, 41, 31, 0.14);
    --radius-sm: 3px;
    --radius-md: 6px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #ece7d8;
      --ink-soft: #c3bda8;
      --paper: #1c1f17;
      --paper-dim: #242820;
      --line: #3a3e30;
      --herb: #5fc37f;
      --herb-dark: #3f9c5c;
      --mustard: #f2bb3a;
      --tomato: #ef7a52;
      --sky: #52b3ef;
      --plum: #b784e6;
      --berry: #ef6d97;
      --card: #22261d;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ece7d8;
    --ink-soft: #c3bda8;
    --paper: #1c1f17;
    --paper-dim: #242820;
    --line: #3a3e30;
    --herb: #5fc37f;
    --herb-dark: #3f9c5c;
    --mustard: #f2bb3a;
    --tomato: #ef7a52;
    --sky: #52b3ef;
    --plum: #b784e6;
    --berry: #ef6d97;
    --card: #22261d;
    --shadow: rgba(0, 0, 0, 0.4);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100%;
  }
  h1, h2, h3, .display {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 2.2rem 1.5rem 5rem;
  }
  header.page {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 2.4rem;
    padding-bottom: 1.1rem;
    flex-wrap: wrap;
    position: relative;
  }
  header.page::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 5px;
    background: linear-gradient(90deg,
      var(--herb) 0 16%, var(--mustard) 16% 33%, var(--tomato) 33% 50%,
      var(--sky) 50% 67%, var(--plum) 67% 84%, var(--berry) 84% 100%);
    border-radius: 3px;
  }
  header.page .title-block h1 {
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    line-height: 1.05;
  }
  header.page .title-block p {
    margin: 0.35rem 0 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
    max-width: 34ch;
  }
  .theme-toggle {
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.45rem 0.85rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
  }
  .theme-toggle:hover { background: var(--paper-dim); }
  .header-actions {
    display: flex;
    gap: 0.6rem;
  }
  #installBtn {
    border-color: var(--mustard);
    color: var(--mustard);
  }
  #installBtn:hover { background: var(--mustard); color: var(--paper); }
  .ios-install-tip {
    font-size: 0.78rem;
    color: var(--ink-soft);
    background: var(--paper-dim);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.5rem 0.8rem;
    margin: -1.4rem 0 1.6rem;
    display: none;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(260px, 340px) 1fr;
    gap: 2.4rem;
    align-items: start;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  .pantry-panel h2 {
    font-size: 1.3rem;
    margin-bottom: 0.9rem;
  }
  .add-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.1rem;
  }
  .add-row input {
    flex: 1;
    font-family: 'Karla', sans-serif;
    font-size: 1rem;
    padding: 0.65rem 0.8rem;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--ink);
  }
  .add-row input:focus { outline: 2px solid var(--herb); outline-offset: 1px; }
  .add-row button {
    background: var(--herb);
    color: var(--paper);
    border: none;
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    line-height: 1;
    width: 44px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .add-row button:hover { background: var(--herb-dark); }
  .add-row button:focus-visible, .theme-toggle:focus-visible, input:focus-visible { outline: 2px solid var(--herb); outline-offset: 2px; }

  .quick-add {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.4rem;
  }
  .quick-add span {
    font-size: 0.75rem;
    color: var(--ink-soft);
    width: 100%;
    text-transform: lowercase;
  }
  .quick-add button {
    background: none;
    border: 1.5px dashed var(--dot, var(--line));
    color: var(--ink-soft);
    font-family: 'Karla', sans-serif;
    font-size: 0.82rem;
    padding: 0.3rem 0.65rem;
    border-radius: 20px;
    cursor: pointer;
  }
  .quick-add button:hover { border-style: solid; color: var(--ink); }

  .pantry-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  .pantry-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    padding: 0.6rem 0.1rem;
    border-bottom: 1px solid var(--line);
    font-size: 0.98rem;
  }
  .pantry-list li span.name {
    text-transform: capitalize;
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }
  .pantry-list li span.name::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot, var(--herb));
    flex-shrink: 0;
  }
  .pantry-list li button {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 0.2rem 0.4rem;
  }
  .pantry-list li button:hover { color: var(--tomato); }
  .empty-pantry {
    padding: 1.4rem 0.2rem;
    color: var(--ink-soft);
    font-size: 0.92rem;
    border-bottom: 1px solid var(--line);
  }
  .pantry-count {
    margin-top: 0.9rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .recipes-panel h2 {
    font-size: 1.3rem;
    margin-bottom: 0.3rem;
  }
  .recipes-panel > p.sub {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 0 0 1.3rem;
  }
  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.1rem;
  }
  .recipe-card {
    --accent: var(--herb);
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 1.15rem 1.15rem 1.2rem;
    box-shadow: 0 2px 8px var(--shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  .recipe-card.ready { border-color: var(--herb); border-top-color: var(--herb); }
  .match-pill {
    position: absolute;
    top: -10px;
    right: 14px;
    background: var(--accent);
    color: #fffdf7;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.22rem 0.55rem;
    border-radius: 20px;
    letter-spacing: 0.01em;
  }
  .recipe-card.ready .match-pill { background: var(--herb); }
  .recipe-card h3 {
    font-size: 1.15rem;
    padding-right: 3.2rem;
    line-height: 1.2;
  }
  .recipe-meta {
    font-size: 0.78rem;
    color: var(--ink-soft);
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .cuisine-chip {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
    font-weight: 700;
    padding: 0.12rem 0.55rem;
    border-radius: 20px;
    font-size: 0.72rem;
  }
  .ingredient-line {
    font-size: 0.87rem;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .ingredient-line .have { color: var(--ink); }
  .ingredient-line .missing { color: var(--tomato); text-decoration: underline dotted; text-underline-offset: 3px; }
  .recipe-card details {
    margin-top: 0.2rem;
    font-size: 0.87rem;
  }
  .recipe-card summary {
    cursor: pointer;
    color: var(--herb-dark);
    font-weight: 600;
    list-style: none;
  }
  .recipe-card summary::-webkit-details-marker { display: none; }
  .recipe-card summary::after { content: " ›"; }
  .recipe-card details[open] summary::after { content: " ⌄"; }
  .recipe-card ol {
    margin: 0.5rem 0 0;
    padding-left: 1.1rem;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .no-match {
    color: var(--ink-soft);
    font-size: 0.95rem;
    padding: 2rem 0.2rem;
    border-top: 1px dashed var(--line);
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    margin-bottom: 1.2rem;
  }
  #cuisineSelect {
    font-family: 'Karla', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    padding: 0.35rem 0.8rem;
    cursor: pointer;
  }
  .filter-row {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .filter-row button {
    background: none;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    font-family: 'Karla', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    cursor: pointer;
  }
  .filter-row button.active {
    border-color: var(--herb);
    background: var(--herb);
    color: var(--paper);
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div class="title-block">
      <h1>What's in the Pantry</h1>
      <p>Log what you have. See what you can cook.</p>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="installBtn" type="button" style="display:none;">Install app</button>
      <button class="theme-toggle" id="themeToggle" type="button">Dark mode</button>
    </div>
  </header>

  <p class="ios-install-tip" id="iosTip">Tap the Share icon in Safari, then "Add to Home Screen" to install this as an app.</p>

  <div class="layout">
    <section class="pantry-panel" aria-label="Your pantry">
      <h2>Your pantry</h2>
      <form class="add-row" id="addForm">
        <input type="text" id="itemInput" placeholder="Add an ingredient…" autocomplete="off">
        <button type="submit" aria-label="Add ingredient">+</button>
      </form>
      <div class="quick-add" id="quickAdd">
        <span>common staples</span>
      </div>
      <ul class="pantry-list" id="pantryList"></ul>
      <div class="pantry-count" id="pantryCount"></div>
    </section>

    <section class="recipes-panel" aria-label="Recipe matches">
      <h2 id="recipeHeading">Recipes you can make</h2>
      <p class="sub" id="recipeSub">Add a few ingredients to see matches.</p>
      <div class="filter-bar">
        <select id="cuisineSelect" aria-label="Filter by cuisine"></select>
        <div class="filter-row" id="filterRow"></div>
      </div>
      <div class="recipe-grid" id="recipeGrid"></div>
      <div class="no-match" id="noMatch" style="display:none;"></div>
    </section>
  </div>
</div>
